name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main, android-back]
    tags:
      - 'v*'
  pull_request:
    branches: [main, android-back]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Cache Buildozer global directory
        id: cache-buildozer-global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer local directory
        if: steps.cache-buildozer-global.outputs.cache-hit == 'true'
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}

      - name: Install npm dependencies and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify frontend build
        run: |
          echo "Checking frontend/dist directory:"
          ls -la frontend/dist/

      - name: Get version from buildozer.spec
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' buildozer.spec | cut -d '=' -f 2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build APK
        run: |
          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          MAKEFLAGS: -j4

      - name: List built files
        run: |
          echo "Files in bin/:"
          ls -lh bin/ || echo "No bin directory found"
          echo ""
          echo "Files in .buildozer/android/platform/build-*/output:"
          find .buildozer/android/platform -name "*.apk" -type f || echo "No APK files found"

      - name: Find and rename APK
        id: find_apk
        run: |
          # Find the APK file
          APK_PATH=$(find .buildozer/android/platform/build-*/output -name "*.apk" -type f | head -1)

          if [ -z "$APK_PATH" ]; then
            # Fallback: check bin directory
            APK_PATH=$(find bin -name "*.apk" -type f | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"

          # Create bin directory if it doesn't exist
          mkdir -p bin

          # Copy and rename APK
          VERSION="${{ steps.get_version.outputs.version }}"
          NEW_NAME="bin/SearchAPIWebUI-${VERSION}-android-debug.apk"
          cp "$APK_PATH" "$NEW_NAME"

          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed APK to: $NEW_NAME"

          # Show APK info
          ls -lh "$NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchAPIWebUI-${{ steps.get_version.outputs.version }}-android
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
