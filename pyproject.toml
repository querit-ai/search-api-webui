[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-api-webui"
version = "0.2.7"
description = "A minimal Android WebUI application."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "querit.ai" }
]
keywords = ["android", "webui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
]

dependencies = [
    "flask>=2.2.5",
    "flask-cors>=3.0.0"
]

[project.urls]
Homepage = "https://github.com/querit-ai/search-api-webui"
Repository = "https://github.com/querit-ai/search-api-webui.git"

[tool.hatch.build.targets.wheel]
packages = ["search_api_webui"]

[tool.hatch.build.targets.sdist]
include = [
    "search_api_webui",
    "README.md",
    "LICENSE"
]
exclude = [
    "frontend",
    ".github"
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "search_api_webui/static"
